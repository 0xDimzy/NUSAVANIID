<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#151914" />
    <title>404 — Page Not Found | Nusavaniid</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg?v=3" />
    <link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon.png?v=3" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;1,500&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #10140f;
        --panel: #151914;
        --ivory: #f6f0e4;
        --muted: #92988b;
        --brass: #c9a45d;
        --border: rgba(246, 240, 228, 0.14);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 20px;
        background:
          radial-gradient(circle at 78% 18%, rgba(201, 164, 93, 0.12), transparent 42%),
          radial-gradient(circle at 12% 88%, rgba(201, 164, 93, 0.07), transparent 46%),
          var(--bg);
        color: var(--ivory);
        font-family: "Manrope", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .panel {
        width: min(680px, 100%);
        border: 1px solid var(--border);
        background: var(--panel);
        padding: clamp(40px, 7vw, 72px);
        text-align: center;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
      }

      .code {
        display: inline-block;
        color: var(--brass);
        font-family: "Manrope", sans-serif;
        font-size: 11px;
        letter-spacing: 0.32em;
        border: 1px solid rgba(201, 164, 93, 0.35);
        padding: 9px 18px;
        margin-bottom: 26px;
      }

      h1 {
        font-family: "Playfair Display", Georgia, serif;
        font-weight: 600;
        font-size: clamp(34px, 6.4vw, 58px);
        line-height: 1.06;
        margin-bottom: 20px;
      }

      h1 em {
        font-style: italic;
        font-weight: 500;
        color: var(--brass);
      }

      .lede {
        color: var(--muted);
        font-size: clamp(14.5px, 2.4vw, 16px);
        line-height: 1.75;
        max-width: 46ch;
        margin: 0 auto 34px;
      }

      .actions {
        display: flex;
        gap: 14px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 52px;
        padding: 14px 28px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        text-decoration: none;
        border: 1px solid transparent;
        transition: 0.25s;
      }

      .btn.gold {
        background: linear-gradient(120deg, #e0c07a, var(--brass));
        color: #17130c;
      }

      .btn.gold:hover {
        filter: brightness(1.06);
      }

      .btn.ghost {
        border-color: rgba(246, 240, 228, 0.28);
        color: var(--ivory);
      }

      .btn.ghost:hover {
        border-color: var(--brass);
        color: var(--brass);
      }

      .btn:focus-visible {
        outline: 2px solid var(--brass);
        outline-offset: 3px;
      }

      .meta {
        margin-top: 38px;
        padding-top: 22px;
        border-top: 1px solid var(--border);
        color: rgba(246, 240, 228, 0.4);
        font-family: "Manrope", sans-serif;
        font-size: 9px;
        letter-spacing: 0.28em;
      }

      @media (max-width: 560px) {
        .actions {
          flex-direction: column;
        }

        .btn {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <span class="code">ERROR 404</span>
      <h1>This page never made it <em>out of the curing room.</em></h1>
      <p class="lede">
        The page you are looking for does not exist or has moved.
        Our vanilla, however, is exactly where it should be.
      </p>
      <div class="actions">
        <a class="btn gold" href="/">Back to Home</a>
        <a class="btn ghost" href="https://wa.me/6285111580309" target="_blank" rel="noopener">WhatsApp Export Desk</a>
      </div>
      <p class="meta">NUSAVANIID · PREMIUM INDONESIAN VANILLA · EAST JAVA</p>
    </main>
  </body>
</html>
